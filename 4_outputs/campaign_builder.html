<!DOCTYPE html><html><head><meta charset="utf-8"><title>Formosa campaign builder</title>
<style>body{font-family:'Segoe UI',Arial,sans-serif;color:#1f2933;max-width:900px;margin:24px auto;padding:0 16px}
h1{color:#0b6e99;font-size:22px}label{display:block;font-size:13px;color:#52606d;margin-top:10px}
select{width:100%;padding:8px;font-size:14px;border:1px solid #cbd2d9;border-radius:6px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.card{border:1px solid #e4e7eb;border-radius:8px;padding:14px;margin-top:16px}
.big{font-size:26px;color:#0b6e99;font-weight:600}.msg{white-space:pre-wrap;background:#f5f7fa;padding:12px;border-radius:6px;font-size:14px}
.pass{color:#2f855a;font-weight:600}.fail{color:#c53030;font-weight:600}button{padding:8px 14px;border:0;border-radius:6px;background:#0b6e99;color:#fff;cursor:pointer}</style></head>
<body><h1>Formosa campaign builder</h1><p>Pick an approved offer and a channel. You get the audience, the finished message with the legal footer, and a brand check. Works offline.</p>
<div class="grid"><div><label>Offer</label><select id="offer"></select></div><div><label>Channel</label><select id="channel"></select></div>
<div><label>Who</label><select id="tier"></select></div><div><label>Reason in their note</label><select id="reason"></select></div></div>
<div class="card"><div class="big" id="size"></div><div id="sizeNote"></div></div>
<div class="card"><b id="head"></b><div class="msg" id="body"></div><p><b>Call to action:</b> <span id="cta"></span></p>
<p id="check"></p><button onclick="navigator.clipboard.writeText(document.getElementById('head').innerText+'\n\n'+document.getElementById('body').innerText)">Copy message</button></div>
<script>const D={"counts": [{"offer": "Data add-on", "tier": "R0_no_signal", "reason": "data_need", "n": 2}, {"offer": "Data add-on", "tier": "R3_new_and_fragile", "reason": "network", "n": 1}, {"offer": "Data add-on", "tier": "R4_unhappy_quiet", "reason": "device", "n": 1}, {"offer": "Data add-on", "tier": "R4_unhappy_quiet", "reason": "network", "n": 10}, {"offer": "Data boost", "tier": "R1_leaving_now", "reason": "contract", "n": 8}, {"offer": "Data boost", "tier": "R1_leaving_now", "reason": "price", "n": 2}, {"offer": "Data boost", "tier": "R2_wavering", "reason": "contract", "n": 20}, {"offer": "Data boost", "tier": "R2_wavering", "reason": "price", "n": 10}, {"offer": "No offer: care call", "tier": "R2_wavering", "reason": "contract", "n": 3}, {"offer": "No offer: care call", "tier": "R2_wavering", "reason": "price", "n": 2}, {"offer": "No offer: fix the bill and call back", "tier": "R2_wavering", "reason": "billing", "n": 4}, {"offer": "No offer: fix the bill and call back", "tier": "R2_wavering", "reason": "contract", "n": 1}, {"offer": "No offer: fix the bill and call back", "tier": "R2_wavering", "reason": "price", "n": 2}, {"offer": "No offer: fix the bill and call back", "tier": "R4_unhappy_quiet", "reason": "billing", "n": 134}, {"offer": "No offer: fix the bill and call back", "tier": "R4_unhappy_quiet", "reason": "device", "n": 1}, {"offer": "No offer: network care call", "tier": "R2_wavering", "reason": "contract", "n": 1}, {"offer": "No offer: network care call", "tier": "R2_wavering", "reason": "network", "n": 1}, {"offer": "No offer: network care call", "tier": "R2_wavering", "reason": "price", "n": 1}, {"offer": "No offer: network care call", "tier": "R4_unhappy_quiet", "reason": "device", "n": 4}, {"offer": "No offer: network care call", "tier": "R4_unhappy_quiet", "reason": "network", "n": 191}, {"offer": "No offer: welcome check-in", "tier": "R3_new_and_fragile", "reason": "billing", "n": 7}, {"offer": "No offer: welcome check-in", "tier": "R3_new_and_fragile", "reason": "data_need", "n": 1}, {"offer": "No offer: welcome check-in", "tier": "R3_new_and_fragile", "reason": "device", "n": 7}, {"offer": "No offer: welcome check-in", "tier": "R3_new_and_fragile", "reason": "network", "n": 6}, {"offer": "No offer: welcome check-in", "tier": "R3_new_and_fragile", "reason": "other", "n": 829}, {"offer": "No offer: welcome check-in", "tier": "R3_new_and_fragile", "reason": "price", "n": 3}, {"offer": "Plan upgrade", "tier": "R0_no_signal", "reason": "data_need", "n": 8}, {"offer": "Plan upgrade", "tier": "R0_no_signal", "reason": "other", "n": 13}, {"offer": "Plan upgrade", "tier": "R0_no_signal", "reason": "price", "n": 3}, {"offer": "Plan upgrade", "tier": "R3_new_and_fragile", "reason": "data_need", "n": 1}, {"offer": "Plan upgrade", "tier": "R4_unhappy_quiet", "reason": "billing", "n": 1}, {"offer": "Renewal discount", "tier": "R1_leaving_now", "reason": "contract", "n": 11}, {"offer": "Renewal discount", "tier": "R1_leaving_now", "reason": "price", "n": 2}, {"offer": "Renewal discount", "tier": "R2_wavering", "reason": "contract", "n": 17}, {"offer": "Renewal discount", "tier": "R2_wavering", "reason": "price", "n": 15}, {"offer": "Roaming pass", "tier": "R0_no_signal", "reason": "other", "n": 67}, {"offer": "Roaming pass", "tier": "R3_new_and_fragile", "reason": "network", "n": 1}, {"offer": "Roaming pass", "tier": "R3_new_and_fragile", "reason": "other", "n": 1}, {"offer": "Roaming pass", "tier": "R4_unhappy_quiet", "reason": "billing", "n": 3}, {"offer": "Roaming pass", "tier": "R4_unhappy_quiet", "reason": "network", "n": 6}], "templates": {"Renewal discount": {"headline": "Your rate plan, NT$100 a month lower", "body": "Your contract is ending soon, and we would like you to stay. Renew on a new 24-month contract and we take NT$100 off your monthly bill for the first 12 months. Same number, nothing to switch.", "cta": "Reply YES and we will set it up", "call_script": "Thank the customer for their time with Formosa. Acknowledge what they told us last time ({reason_text}). Offer NT$100 off the monthly bill for 12 months on a new 24-month contract. If they say yes, confirm the new contract terms and end date. If no, log the reason and do not push."}, "Data boost": {"headline": "10 GB extra every month, on us", "body": "We heard that your plan does not always stretch far enough. For the next six months we are adding 10 GB to your monthly data at no extra cost. It starts as soon as you accept.", "cta": "Tap to add your extra data", "call_script": "Acknowledge the customer's concern ({reason_text}). Offer an extra 10 GB a month for six months at no cost. Confirm it does not change their contract. Log the answer."}, "Device credit": {"headline": "NT$3,000 toward your next phone", "body": "Your phone has been giving you trouble. Move to a new 30-month premium contract and we put NT$3,000 toward a new handset of your choice. Your number and rate plan benefits stay with you.", "cta": "Book a store visit", "call_script": "Acknowledge the device issue ({reason_text}). Offer NT$3,000 toward a new phone on a new 30-month premium contract. Book a store visit if interested."}, "No offer: fix the bill and call back": {"headline": "We are looking at your bill", "body": "You told us your recent bill did not look right. A member of our billing team is checking it and will call you back with the result. If we made an error, we will correct it.", "cta": "No action needed: we will call you", "call_script": "Billing care call. Walk through the bill line by line. If Formosa made the error, correct it (this is not an offer). Log the outcome."}, "No offer: network care call": {"headline": "We are checking coverage where you are", "body": "You told us the signal has been weak where you use your phone. Our network team is reviewing your area and will contact you with what we found and what we can do.", "cta": "Reply with the address where it is weakest", "call_script": "Network care call. Confirm the location and time of the problem, open a network ticket, and give a date for the follow-up."}, "No offer: care call": {"headline": "Checking in on your service", "body": "Thank you for being with Formosa. We would like to make sure your rate plan still fits how you use your phone. A short call is all it takes.", "cta": "Reply CALL to pick a time", "call_script": "Care call. Ask how the service is going, check the plan fits their usage, log any issue."}, "No offer: welcome check-in": {"headline": "Settling in with Formosa", "body": "You joined us recently, so we want to check that your rate plan fits how you use your phone. Open the app to see your usage so far, or reply and we will help you choose.", "cta": "Open the app to see your usage", "call_script": "Welcome call. Check the plan fits their usage and that nothing is wrong with the service. Log any issue."}, "Plan upgrade": {"headline": "Move to premium, NT$100 off for four months", "body": "You asked about more from your rate plan. Upgrade from basic to premium and we take NT$100 off your premium bill for the first four months. Same number, more data and benefits.", "cta": "Tap to see your premium price"}, "Data add-on": {"headline": "20 GB more each month, first two months free", "body": "If you often run low on data, add 20 GB a month for NT$149. The first two months are free, and you can stop at any time after that.", "cta": "Tap to add 20 GB"}, "Roaming pass": {"headline": "Travelling in Asia? Your first 7-day pass is free", "body": "Take your data with you. A 7-day Asia data pass costs NT$499, and your first one is free. Switch it on before you fly and use your phone as you do at home.", "cta": "Tap to claim your free pass"}, "Welcome gift": {"headline": "Open a Formosa line and get a welcome gift", "body": "Join Formosa on a qualifying rate plan and receive a welcome gift with your new line. Number portability is simple, and our team handles the transfer.", "cta": "See rate plans"}, "In-store new-line gift": {"headline": "A gift with every new line opened in store", "body": "Visit a Formosa Telecom store, open a new line on a qualifying rate plan and take home a gift the same day.", "cta": "Find your nearest store"}, "Comeback offer": {"headline": "Welcome back to Formosa", "body": "We have improved our rate plans since you left. Come back on a new contract and get a discount on your first months.", "cta": "See your comeback price"}}, "footer": "Plan details are governed by the formal contract and the latest published notice. Actual rates, offers, and terms of use are subject to the official website or in-store notice and may change without prior notification. For details, call 0800-XXX-XXX or visit a Formosa Telecom store.", "short": "Terms and conditions: formosa-telecom.example/terms", "banned": {"cheapest guarantee": "guarantee\\w*\\s+(the\\s+)?cheapest|cheapest\\s+in\\s+taiwan", "never drops": "never\\s+drops?|never\\s+lose\\s+(a\\s+)?connection|no\\s+dropped\\s+calls\\s+ever", "strongest signal guarantee": "guarantee\\w*\\s+(the\\s+)?strongest|strongest\\s+signal", "only one in the industry": "only\\s+one\\s+in\\s+the\\s+industry|industry'?s\\s+only", "guaranteed win/rebate": "guarantee\\w*\\s+(to\\s+win|rebate)", "fastest network (unqualified)": "fastest\\s+network", "never raise prices": "never\\s+(to\\s+)?raise\\s+(our\\s+)?prices|guarantee\\w*\\s+never"}, "share": {"SMS": 0.74, "LINE": 0.41, "Email": 0.33, "App Push": 0.27, "Outbound Call": 0.92}};
const TIERS={any:"Anyone with this offer",R1_leaving_now:"R1 · said they are leaving",R2_wavering:"R2 · considering leaving",R3_new_and_fragile:"R3 · joined < 6 months ago",R4_unhappy_quiet:"R4 · complaint, no leave talk"};
const REASONS={any:"Any reason",contract:"Unsure about renewing",price:"Price or a rival",device:"Phone problem",billing:"Bill looks wrong",network:"Coverage or speed",data_need:"Runs out of data",other:"Other"};
const RT={contract:"they are unsure about renewing",price:"they felt the plan is expensive or that a rival offers more",billing:"their bill looked wrong",network:"signal problems",device:"a problem with their phone",data_need:"running out of data"};
const $=id=>document.getElementById(id);
function fill(id,obj){$(id).innerHTML=Object.entries(obj).map(([k,v])=>`<option value="${k}">${v}</option>`).join("")}
fill("offer",Object.fromEntries(Object.keys(D.templates).map(k=>[k,k])));fill("channel",Object.fromEntries(Object.keys(D.share).map(k=>[k,k])));fill("tier",TIERS);fill("reason",REASONS);
function check(h,b,c,ch){const p=[];const t=[h,b,c].join(" ");const end=b.trim();
 if(!(end.endsWith(D.footer)||((ch==="SMS"||ch==="LINE")&&end.endsWith(D.short))))p.push("legal footer missing or altered");
 for(const[k,re]of Object.entries(D.banned)){if(new RegExp(re,"i").test(t)&&!(k.startsWith("fastest")&&/independent|20\d\d/i.test(t)))p.push("banned claim: "+k)}
 if((t.match(/!/g)||[]).length>=2)p.push("stacked exclamation marks");return p}
function update(){const o=$("offer").value,ch=$("channel").value,ti=$("tier").value,re=$("reason").value,T=D.templates[o];
 const n=D.counts.filter(r=>r.offer===o&&(ti==="any"||r.tier===ti)&&(re==="any"||r.reason===re)).reduce((a,r)=>a+r.n,0);
 $("size").innerText=(n*130).toLocaleString()+" customers";
 $("sizeNote").innerText=`${n} in the sample × 130. About ${Math.round(n*130*D.share[ch]).toLocaleString()} can be reached on ${ch} (${Math.round(D.share[ch]*100)}% have agreed).`+(n?"":" Nobody matches: widen Who or Reason.");
 let body;if(ch==="Outbound Call"){body=(T.call_script||T.body).replace("{reason_text}",RT[re]||"their recent contact with us")}
 else{const f=(ch==="SMS"||ch==="LINE")?D.short:D.footer;body=(ch==="SMS"?"Formosa: "+T.body+" "+T.cta+".":T.body)+"\n\n"+f}
 $("head").innerText=T.headline;$("body").innerText=body;$("cta").innerText=T.cta;
 const p=ch==="Outbound Call"?[]:check(T.headline,body,T.cta,ch);
 $("check").innerHTML=ch==="Outbound Call"?'<span class="pass">Call script</span> · agents read the terms on request':(p.length?'<span class="fail">FAIL</span> · '+p.join("; "):'<span class="pass">PASS</span> · approved offer, legal footer verbatim, no banned claims')}
["offer","channel","tier","reason"].forEach(i=>$(i).onchange=update);update();</script></body></html>
